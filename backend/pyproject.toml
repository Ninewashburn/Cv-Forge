[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvforge-backend"
version = "0.1.0"
description = "Backend local-first pour CVForge"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100,<1",
    "fastapi>=0.124,<1",
    "uvicorn[standard]>=0.38,<1",
    "sqlalchemy>=2.0.43,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "fpdf2>=2.8,<3",
    "pypdf>=5.1,<7",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "pyinstaller>=6,<7",
]
# Fenêtre native de l'exe (V1.5). Optionnel : sans lui, l'exe se rabat sur le
# navigateur. Installé par build_portable.py avant de geler.
desktop = [
    "pywebview>=5,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Les gabarits de prompts sont du CONTENU (phrases françaises envoyées au LLM),
# pas du code : les couper changerait le prompt. Lignes longues assumées.
"app/services/copilot_service.py" = ["E501"]
"app/services/llm_service.py" = ["E501"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
pythonpath = ["."]
testpaths = ["tests"]
