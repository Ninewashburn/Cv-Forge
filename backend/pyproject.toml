[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvforge-backend"
version = "0.1.0"
description = "Backend local-first pour CVForge"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124,<1",
    "uvicorn[standard]>=0.38,<1",
    "sqlalchemy>=2.0.43,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "fpdf2>=2.8,<3",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
pythonpath = ["."]
testpaths = ["tests"]
