<div class="atelier-head">
  <p class="eyebrow">ATELIER - PARCOURS GUIDÉ</p>
  @if (store.hasUnsavedWork() || store.application()) {
    <button type="button" class="btn-link" (click)="restart()">Recommencer à zéro</button>
  }
</div>

<nav class="steps" aria-label="Étapes du parcours">
  @for (s of steps; track s.n) {
    <button
      type="button"
      class="step"
      [class.current]="store.step() === s.n"
      [class.done]="store.step() > s.n"
      [disabled]="disabled(s.n)"
      [attr.aria-current]="store.step() === s.n ? 'step' : null"
      (click)="store.goTo(s.n)"
    >
      <span class="n">{{ s.n < 10 ? '0' + s.n : s.n }}</span>
      <span class="t">{{ s.label }}</span>
    </button>
  }
</nav>

@switch (store.step()) {
  @case (1) {
    <cvforge-sources />
  }
  @case (2) {
    <cvforge-analyse />
  }
  @case (3) {
    <cvforge-adaptation />
  }
  @case (4) {
    <cvforge-avant-apres />
  }
  @case (5) {
    <cvforge-export />
  }
}
