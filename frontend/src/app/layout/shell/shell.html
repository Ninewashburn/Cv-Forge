<header class="masthead">
  <div class="brand">
    <h1>CV<span class="forge">Forge</span></h1>
    <div class="bar" aria-hidden="true"></div>
    <div class="badges">
      <span class="badge">LOCAL-FIRST</span>
      <span class="badge">V1 - BÊTA</span>
    </div>
  </div>
  <nav class="mast-nav" aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Accueil</a
    >
    <a routerLink="/atelier" routerLinkActive="active">Atelier</a>
    <a routerLink="/profil" routerLinkActive="active">Profil & Preuves</a>
  </nav>
</header>

@if (status.offline()) {
  <div class="alert-bar" role="alert">
    <span>{{ status.offlineMessage }}</span>
  </div>
} @else if (status.unexpected(); as message) {
  <div class="alert-bar" role="alert">
    <span>{{ message }}</span>
    <button type="button" class="alert-close" (click)="status.dismissUnexpected()">
      Fermer ce message
    </button>
  </div>
}

<main class="page">
  <router-outlet />
</main>

<footer class="site-footer">
  <span>RIEN N'EST INVENTÉ À TA PLACE</span>
  <span>RIEN NE SORT DE TON ORDINATEUR SANS TON GESTE</span>
  <span>AVANT / APRÈS : TOUT EST TRACÉ</span>
</footer>
